openapi: 3.0.3
info:
  title: EXE Team Matching – Team Service
  version: 0.2.0-draft
  description: |
    BE-02, BE-61 (bản 4) – bản nháp. Đề tài xuyên kỳ, nhóm, thành viên, lời mời, yêu cầu tham gia (kèm ý tưởng),
    bài đăng, gợi ý (gọi Matching gRPC), đổi nhóm EXE201 (cả đổi đề tài), quan tâm đề tài, giảng viên, mentor,
    chốt nhóm, ghép tự động, thống kê.
    Người phụ trách module: xem AGENTS.md mục 2. Quy ước chung: docs/contracts/README.md.
    Lỗi nghiệp vụ trả 409 với `type` theo tên ràng buộc, ví dụ `.../errors/round-closed`, `.../errors/team-full`,
    `.../errors/already-in-team`, `.../errors/not-leader`, `.../errors/lecturer-full`.
    Bản 4 thêm: `ideas-required` (rule 17), `interest-limit` (rule 19), `team-has-mentor`, `mentor-full` (rule 20),
    `project-change-pending` (rule 26). Khám phá ngoài giai đoạn lập nhóm trả `round-closed` (rule 18).
servers:
  - url: http://localhost:8080
    description: API Gateway
security:
  - bearer: []
tags:
  - { name: Teams, description: "Cường – S01, S05, S08, S13–S16, W15, W16" }
  - { name: Members, description: "Cường – S17" }
  - { name: Invitations, description: "Cường – S04, S12, S18–S20" }
  - { name: JoinRequests, description: "Cường – S09, S12, S20" }
  - { name: Posts, description: "Cường – S10, S11, S21" }
  - { name: Suggestions, description: "Nguyên – S07, S18" }
  - { name: AuditLog, description: "Cường – S22, L05, W24" }
  - { name: ChangeRequests, description: "Thành – S26–S29, W17, W18" }
  - { name: Baseline, description: "Thành – W06 (file nhóm EXE101)" }
  - { name: Lecturers, description: "Thành – S23–S25, L01–L05, W19" }
  - { name: TopicInterests, description: "Thành – L07, S23, S25, W19 (rule 19)" }
  - { name: Mentors, description: "Thành – S15, M01, W16, W28 (rule 20)" }
  - { name: Projects, description: "Thành – S15, S27, S28, W06, W29 (rule 26)" }
  - { name: Admin, description: "Nguyên – W02, W16, W20–W22" }
  - { name: Internal, description: "Job Service gọi, có service token, không qua Gateway" }
paths:
  # ---------------- Teams ----------------
  /api/teams:
    get:
      tags: [Teams]
      summary: Tìm kiếm, lọc, sắp xếp, phân trang nhóm (S05, W15). Sinh viên không thấy nhóm 6/6; sinh viên gọi ngoài giai đoạn lập nhóm → 409 round-closed (rule 18)
      parameters:
        - { name: semesterId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CourseCode' }
        - { name: search, in: query, schema: { type: string }, description: Tên nhóm hoặc tên dự án }
        - { name: domain, in: query, schema: { type: string, example: D04 } }
        - { name: missingSpecializationId, in: query, schema: { type: integer } }
        - { name: minOpenSlots, in: query, schema: { type: integer } }
        - { name: classCode, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TeamStatus' } }
        - { name: invalidOnly, in: query, schema: { type: boolean }, description: 'W15 lọc "chưa đủ điều kiện"' }
        - { name: sort, in: query, schema: { type: string, enum: [name, -createdAt, openSlots, -openSlots, relevance], default: -createdAt } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PagedMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TeamCard' } } } } ] } } } } }
    post:
      tags: [Teams]
      summary: Tạo nhóm, người tạo là trưởng nhóm (S13). Chỉ khi đợt lập nhóm đang mở
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /api/teams/me:
    get:
      tags: [Teams]
      summary: Nhóm của tôi (S15). 404 nếu chưa có nhóm
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /api/teams/me/home:
    get:
      tags: [Teams]
      summary: Dữ liệu trang chủ sinh viên (S01)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { allOf: [ { $ref: '#/components/schemas/TeamCard' } ], type: object, nullable: true }
                  isLeader: { type: boolean }
                  pendingInvitationCount: { type: integer }
                  pendingJoinRequestCount: { type: integer, description: Chỉ với trưởng nhóm }
                  nextAction: { type: string, enum: [CREATE_OR_JOIN, INVITE_MEMBERS, ADD_SPECIALIZATION, CHOOSE_LECTURER, SUBMIT_CHANGE_REQUEST, WAIT_REVIEW, OPEN_WORKSPACE, NONE] }
                  phase: { type: string, enum: [TEAM_FORMATION, SEMESTER_RUNNING], description: Rule 18 – client đổi tab Khám phá ↔ Dự án }
                  interestedLecturerCount: { type: integer, description: Số giảng viên quan tâm đề tài của nhóm (rule 19) }
                  isAutoAssigned: { type: boolean }
  /api/teams/{teamId}:
    get:
      tags: [Teams]
      summary: Chi tiết nhóm (S08 người ngoài xem, S15, L05, W16). SĐT, email thành viên chỉ trả cho đồng đội, giảng viên hướng dẫn, mentor, Admin
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } }, '404': { $ref: '#/components/responses/Problem' } }
    put:
      tags: [Teams]
      summary: Sửa tên nhóm, đề tài, domain (S16 – trưởng nhóm; W16 – Admin). Nhóm EXE201 kế thừa chỉ sửa nhỏ mô tả đề tài; đổi đề tài phải qua yêu cầu đổi nhóm (rule 26)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }

  # ---------------- Members ----------------
  /api/teams/{teamId}/members/{studentId}:
    delete:
      tags: [Members]
      summary: Trưởng nhóm xóa thành viên. Nhóm EXE201 kế thừa → tạo thay đổi chờ duyệt (rule 7)
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/StudentId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberChangeResult' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /api/teams/{teamId}/leave:
    post:
      tags: [Members]
      summary: Thành viên rời nhóm (trưởng nhóm phải chuyển quyền trước)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberChangeResult' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/teams/{teamId}/transfer-leader:
    post:
      tags: [Members]
      summary: Chuyển quyền trưởng nhóm
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [studentId], properties: { studentId: { type: string, format: uuid } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberChangeResult' } } } } }

  # ---------------- Invitations ----------------
  /api/teams/{teamId}/invitations:
    get:
      tags: [Invitations]
      summary: Lời mời nhóm đã gửi (S20 tab 2 – trưởng nhóm)
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/RequestStatus' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } } }
    post:
      tags: [Invitations]
      summary: Trưởng nhóm gửi lời mời (S04, S18, S19). Hết hạn sau 72 giờ
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [studentId], properties: { studentId: { type: string, format: uuid }, message: { type: string, maxLength: 500 } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/invitations/me:
    get:
      tags: [Invitations]
      summary: Lời mời tôi nhận được (S12 tab 1)
      parameters: [ { $ref: '#/components/parameters/RequestStatus' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } } }
  /api/invitations/{id}/accept:
    post: { tags: [Invitations], summary: "Chấp nhận (vào nhóm ngay, hoặc thành thay đổi chờ duyệt với nhóm EXE201 kế thừa)", parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberChangeResult' } } } }, '409': { $ref: '#/components/responses/Problem' } } }
  /api/invitations/{id}/decline:
    post: { tags: [Invitations], summary: Từ chối, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: OK } } }
  /api/invitations/{id}/cancel:
    post: { tags: [Invitations], summary: Trưởng nhóm thu hồi lời mời, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: OK } } }

  # ---------------- Join requests ----------------
  /api/teams/{teamId}/join-requests:
    get:
      tags: [JoinRequests]
      summary: Yêu cầu tham gia gửi tới nhóm (S20 tab 1 – trưởng nhóm)
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/RequestStatus' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } } } } } }
    post:
      tags: [JoinRequests]
      summary: Sinh viên xin tham gia (S09) kèm 1–3 ý tưởng hoặc hasNoIdea = true (rule 17, lỗi 400 ideas-required). Hết hạn sau 72 giờ
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 500 }
                ideas: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Idea' } }
                hasNoIdea: { type: boolean, default: false, description: "Tích \"Chưa có ý tưởng\" – khi true thì ideas phải rỗng" }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/JoinRequest' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/join-requests/me:
    get:
      tags: [JoinRequests]
      summary: Yêu cầu tôi đã gửi (S12 tab 2)
      parameters: [ { $ref: '#/components/parameters/RequestStatus' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } } } } } }
  /api/join-requests/{id}/accept:
    post: { tags: [JoinRequests], summary: Trưởng nhóm chấp nhận, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberChangeResult' } } } }, '409': { $ref: '#/components/responses/Problem' } } }
  /api/join-requests/{id}/decline:
    post: { tags: [JoinRequests], summary: Trưởng nhóm từ chối, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: OK } } }
  /api/join-requests/{id}/cancel:
    post: { tags: [JoinRequests], summary: Sinh viên hủy yêu cầu, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: OK } } }

  # ---------------- Posts ----------------
  /api/teams/{teamId}/recruitment-post:
    put:
      tags: [Posts]
      summary: Tạo hoặc sửa bài tuyển thành viên của nhóm (S21). Mỗi nhóm tối đa 1 bài mở
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecruitmentPostInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecruitmentPost' } } } } }
    delete:
      tags: [Posts]
      summary: Đóng bài tuyển
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '204': { description: OK } }
  /api/seeking-posts:
    get:
      tags: [Posts]
      summary: Sinh viên đang tìm nhóm (S10)
      parameters: [ { name: specializationId, in: query, schema: { type: integer } }, { name: domain, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PagedMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SeekingPost' } } } } ] } } } } }
  /api/seeking-posts/me:
    get: { tags: [Posts], summary: Bài "Tôi đang tìm nhóm" của tôi (S11), responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SeekingPost' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    put: { tags: [Posts], summary: Tạo hoặc sửa bài (S11), requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeekingPostInput' } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SeekingPost' } } } } } }
    delete: { tags: [Posts], summary: Gỡ bài, responses: { '204': { description: OK } } }

  # ---------------- Suggestions (gRPC Matching) ----------------
  /api/teams/{teamId}/suggested-members:
    get:
      tags: [Suggestions]
      summary: Gợi ý thành viên cho nhóm (S18) – Team gọi Matching.SuggestMembers
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { name: limit, in: query, schema: { type: integer, default: 10 } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  missingSpecializations: { type: array, items: { $ref: '#/components/schemas/CatalogRef' } }
                  items:
                    type: array
                    items:
                      type: object
                      properties: { student: { $ref: '#/components/schemas/StudentRef' }, skills: { type: array, items: { type: string } }, score: { type: number }, reasons: { type: array, items: { type: string } }, alreadyInvited: { type: boolean } }
  /api/teams/suggested-for-me:
    get:
      tags: [Suggestions]
      summary: Nhóm gợi ý cho tôi (S07, khu "Gợi ý cho bạn" S05) – Matching.SuggestTeams
      parameters: [ { name: limit, in: query, schema: { type: integer, default: 10 } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object, properties: { team: { $ref: '#/components/schemas/TeamCard' }, score: { type: number }, reasons: { type: array, items: { type: string } } } }

  # ---------------- Audit ----------------
  /api/teams/{teamId}/audit-logs:
    get:
      tags: [AuditLog]
      summary: Lịch sử hoạt động nhóm (S22, L05)
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PagedMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } } } } ] } } } } }
  /api/audit-logs:
    get:
      tags: [AuditLog]
      summary: Nhật ký hệ thống (W24 – Admin)
      parameters: [ { name: teamId, in: query, schema: { type: string, format: uuid } }, { name: actorAccountId, in: query, schema: { type: string, format: uuid } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PagedMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } } } } ] } } } } }

  # ---------------- Baseline EXE101 + change requests (EXE201) ----------------
  /api/teams/baseline-import:
    post:
      tags: [Baseline]
      summary: Admin import file nhóm EXE101 làm mốc, tạo nhóm EXE201 kế thừa (W06)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file, semesterId], properties: { file: { type: string, format: binary }, semesterId: { type: string, format: uuid }, dryRun: { type: boolean, default: true, description: true = chỉ xem trước dòng lỗi } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { teamCount: { type: integer }, studentCount: { type: integer }, linkedProjectCount: { type: integer, description: Nhóm gắn được với đề tài EXE101 theo mã nhóm (rule 26) }, unlinkedTeamCount: { type: integer, description: Còn lại → W29 gắn tay }, errors: { type: array, items: { type: object, properties: { row: { type: integer }, message: { type: string } } } } } }
  /api/teams/{teamId}/pending-changes:
    get:
      tags: [ChangeRequests]
      summary: Mốc EXE101 so với thay đổi đang chờ (S17, S27)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  baselineMembers: { type: array, items: { $ref: '#/components/schemas/Member' } }
                  pendingItems: { type: array, items: { $ref: '#/components/schemas/ChangeItem' } }
                  currentProject: { $ref: '#/components/schemas/ProjectSummary' }
                  wouldHaveMemberCount: { type: integer }
                  wouldHaveSpecializationCount: { type: integer }
  /api/teams/{teamId}/pending-changes/project:
    put:
      tags: [ChangeRequests, Projects]
      summary: Trưởng nhóm EXE201 thêm / sửa thay đổi "Đổi đề tài" đang chờ (S27). Gửi cùng yêu cầu đổi nhóm (rule 26)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 2, maxLength: 200 }, description: { type: string, maxLength: 4000 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeItem' } } } }, '409': { $ref: '#/components/responses/Problem' } }
    delete:
      tags: [ChangeRequests, Projects]
      summary: Bỏ thay đổi đề tài đang chờ
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '204': { description: OK } }
  /api/teams/{teamId}/change-requests:
    get:
      tags: [ChangeRequests]
      summary: Yêu cầu đổi nhóm của nhóm (S26)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } } } } } }
    post:
      tags: [ChangeRequests]
      summary: Trưởng nhóm gửi yêu cầu (S28). Lý do bắt buộc; số lượng và % do hệ thống tính; chặn khi nhóm < 4 người
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [itemIds, reason], properties: { itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }, reason: { type: string, minLength: 10, maxLength: 1000 } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeRequest' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/change-requests:
    get:
      tags: [ChangeRequests]
      summary: Danh sách cho Admin (W17)
      parameters: [ { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }, { name: roundId, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PagedMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } } } } ] } } } } }
  /api/change-requests/{id}:
    get: { tags: [ChangeRequests], summary: "Chi tiết, so sánh mốc và sau thay đổi (S29, W18)", parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeRequestDetail' } } } } } }
  /api/change-requests/{id}/approve:
    post: { tags: [ChangeRequests], summary: "Admin duyệt – áp dụng thay đổi, ghi audit log", requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 1000 } } } } } }, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeRequest' } } } } } }
  /api/change-requests/{id}/reject:
    post: { tags: [ChangeRequests], summary: "Admin từ chối – ghi chú bắt buộc, nhóm giữ nguyên", requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 1000 } } } } } }, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeRequest' } } } } } }

  # ---------------- Projects (rule 26) ----------------
  /api/teams/{teamId}/project:
    get:
      tags: [Projects]
      summary: Đề tài của nhóm và lịch sử qua các kỳ (S15 thẻ đề tài, bottom sheet lịch sử)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectDetail' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /api/projects:
    get:
      tags: [Projects]
      summary: Đề tài qua các kỳ (W29 – Admin)
      parameters:
        - { name: semesterId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string, example: D04 } }
        - { name: pivotedOnly, in: query, schema: { type: boolean }, description: Chỉ đề tài đã đổi ở EXE201 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PagedMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ProjectDetail' } } } } ] } } } } }
  /api/projects/unlinked-teams:
    get:
      tags: [Projects]
      summary: Nhóm EXE201 kế thừa chưa gắn được đề tài sau import mốc (W29 mục "Chưa gắn đề tài")
      parameters: [ { name: semesterId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamCard' } } } } } }
  /api/projects/{id}/link-team:
    post:
      tags: [Projects]
      summary: Admin gắn tay một nhóm EXE201 với đề tài EXE101 (phát TeamLinkedToProject)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [teamId], properties: { teamId: { type: string, format: uuid } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectDetail' } } } }, '409': { $ref: '#/components/responses/Problem' } }

  # ---------------- Quan tâm của cố vấn (rule 19) ----------------
  /api/topic-recommendations/me:
    get:
      tags: [TopicInterests]
      summary: Đề tài cho giảng viên hoặc mentor (L07 tab Gợi ý) – Matching SuggestTopicsForLecturer. Giảng viên – đề tài mình hướng dẫn ở EXE101 đứng đầu
      parameters: [ { $ref: '#/components/parameters/AdvisorKind' }, { $ref: '#/components/parameters/CourseCode' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  openInterestCount: { type: integer }
                  interestLimit: { type: integer, description: "Giảng viên: số nhóm còn nhận + interestExtraSlots (maxInterestsUnlimited nếu không đặt tối đa); mentor: tối đa + interestExtraSlots" }
                  remainingCapacity: { type: integer, nullable: true, description: null khi không giới hạn }
                  interestOpen: { type: boolean, description: "false ngoài giai đoạn quan tâm (giảng viên: sau đợt lập nhóm; mentor: từ tuần bắt đầu mentor)" }
                  matchingAt: { type: string, format: date-time, nullable: true, description: Thời điểm hệ thống sẽ ghép }
                  items: { type: array, items: { $ref: '#/components/schemas/TopicRecommendation' } }
  /api/topic-interests/me:
    get:
      tags: [TopicInterests]
      summary: Đề tài tôi đang quan tâm (L07 tab Đã quan tâm)
      parameters: [ { $ref: '#/components/parameters/AdvisorKind' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TopicInterest' } } } } } }
  /api/teams/{teamId}/topic-interests:
    get:
      tags: [TopicInterests]
      summary: Cố vấn đang quan tâm nhóm (S23 – thành viên thấy tên giảng viên; Admin W19, W28 thấy tất cả)
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/AdvisorKind' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TopicInterest' } } } } } }
    post:
      tags: [TopicInterests]
      summary: Giảng viên / mentor quan tâm nhóm (L07). Không giữ chỗ. 409 interest-limit khi đạt giới hạn, interest-closed ngoài giai đoạn, team-has-advisor khi nhóm đã được ghép
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [advisorKind], properties: { advisorKind: { $ref: '#/components/schemas/AdvisorKind' } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TopicInterest' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/topic-interests/{id}:
    delete:
      tags: [TopicInterests]
      summary: Rút quan tâm (client hiện Hoàn tác 5 giây, gọi lại POST để khôi phục)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: OK } }

  # ---------------- Nguyện vọng giảng viên của nhóm (rule 9) ----------------
  /api/teams/{teamId}/lecturer-preferences:
    get:
      tags: [Lecturers]
      summary: Nguyện vọng 1–3 của nhóm (S23, S25) kèm giảng viên quan tâm nhóm và giảng viên EXE101 cùng đề tài
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LecturerPreferenceList' } } } } }
    put:
      tags: [Lecturers]
      summary: Trưởng nhóm thay cả danh sách nguyện vọng (thứ tự trong mảng = thứ hạng). 409 not-leader, preferences-locked khi nhóm đã được ghép, round-closed ngoài đợt lập nhóm
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [lecturerIds], properties: { lecturerIds: { type: array, maxItems: 3, uniqueItems: true, items: { type: string, format: uuid } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LecturerPreferenceList' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/lecturer-preferences/me:
    get:
      tags: [Lecturers]
      summary: Nhóm chọn tôi làm nguyện vọng (L07 tab "Nhóm chọn tôi", L01) – chỉ xem, không chấp nhận / từ chối
      parameters: [ { $ref: '#/components/parameters/CourseCode' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { team: { $ref: '#/components/schemas/TeamCard' }, rank: { type: integer }, iAmInterested: { type: boolean } } } } } } } }

  # ---------------- Cố vấn của nhóm (rule 9, 20) ----------------
  /api/teams/{teamId}/lecturer:
    get:
      tags: [Lecturers]
      summary: Giảng viên hướng dẫn của nhóm và lý do ghép (S15, S25). null khi chưa ghép – client hiện thời điểm ghép
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/LecturerAssignment' } ], type: object, nullable: true } } } } }
  /api/teams/{teamId}/mentor:
    get:
      tags: [Mentors]
      summary: Mentor của nhóm (S15 mục Cố vấn). null nếu chưa ghép – client hiện "Mentor ghép từ tuần n"
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/MentorAssignment' } ], type: object, nullable: true } } } } }
  /api/lecturer-teams/me:
    get:
      tags: [Lecturers]
      summary: Nhóm tôi hướng dẫn (L01 số liệu, L04) kèm lý do ghép; nhóm tôi làm mentor có nhãn "Mentor"
      parameters: [ { $ref: '#/components/parameters/CourseCode' }, { name: classCode, in: query, schema: { type: string } }, { name: search, in: query, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { maxTeams: { type: integer, nullable: true }, instructing: { type: array, items: { $ref: '#/components/schemas/AdvisedTeam' } }, mentoring: { type: array, items: { $ref: '#/components/schemas/AdvisedTeam' }, description: "Nhóm giảng viên làm mentor (nhãn \"Mentor\" ở L04)" } } } } }
  /api/mentor-teams/me:
    get:
      tags: [Mentors]
      summary: Nhóm tôi đang mentor (M01) kèm lý do ghép
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdvisedTeam' } } } } } }

  # ---------------- Ghép cố vấn tự động – Admin (rule 9, 20; W19, W28) ----------------
  /api/advisor-matching/{kind}/overview:
    get:
      tags: [AdvisorMatching]
      summary: Bảng W19 (LECTURER) / W28 (MENTOR) – từng nhóm với cố vấn hiện tại, lý do, nguyện vọng, quan tâm; tải từng cố vấn
      parameters: [ { $ref: '#/components/parameters/Kind' }, { $ref: '#/components/parameters/CourseCode' }, { name: withoutAdvisor, in: query, schema: { type: boolean } }, { name: search, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matchingAt: { type: string, format: date-time, nullable: true, description: Lúc hệ thống tự ghép (hạn lập nhóm / tuần bắt đầu mentor) }
                  lastRun: { allOf: [ { $ref: '#/components/schemas/AdvisorMatchingRun' } ], type: object, nullable: true }
                  teamsWithPreferences: { type: integer }
                  teamsWithoutAdvisor: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/AdvisorMatchingRow' } }
                  advisorLoads: { type: array, items: { $ref: '#/components/schemas/AdvisorLoad' } }
  /api/advisor-matching/{kind}/preview:
    post:
      tags: [AdvisorMatching]
      summary: Ghép sớm – bước 1. Tính kết quả cho các nhóm chưa có cố vấn, lưu lần chạy PREVIEW (không đổi dữ liệu)
      parameters: [ { $ref: '#/components/parameters/Kind' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [courseCode], properties: { courseCode: { type: string, enum: [EXE101, EXE201] } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdvisorMatchingRun' } } } } }
  /api/advisor-matching/runs/{id}/confirm:
    post:
      tags: [AdvisorMatching]
      summary: Ghép sớm – bước 2. Áp dụng kết quả xem trước (bỏ qua nhóm đã có cố vấn trong lúc chờ), phát LecturerAssigned / MentorAssigned và AdvisorMatchingCompleted
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdvisorMatchingRun' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/advisor-matching/runs/{id}:
    delete:
      tags: [AdvisorMatching]
      summary: Bỏ kết quả xem trước (DISCARDED)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: OK } }
  /api/teams/{teamId}/instructor:
    put:
      tags: [AdvisorMatching]
      summary: Admin đổi giảng viên hướng dẫn của nhóm (reason MANUAL, bắt buộc ghi chú). 409 lecturer-full khi vượt tối đa
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [lecturerId, note], properties: { lecturerId: { type: string, format: uuid }, note: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LecturerAssignment' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/teams/{teamId}/mentor-assignment:
    put:
      tags: [AdvisorMatching]
      summary: Admin đổi mentor của nhóm (MANUAL). Vượt số mong muốn → cảnh báo trong warnings; vượt tối đa → 409 mentor-full
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mentorId, note], properties: { mentorId: { type: string, format: uuid }, note: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { assignment: { $ref: '#/components/schemas/MentorAssignment' }, warnings: { type: array, items: { type: object, properties: { code: { type: string, enum: [ABOVE_PREFERRED] }, message: { type: string } } } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AdvisorMatching]
      summary: Admin gỡ mentor khỏi nhóm (mentor mất quyền vào workspace, lịch sử giữ lại)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses: { '204': { description: OK } }

  # ---------------- Admin: chốt, ghép tự động, thống kê ----------------
  /api/teams/{teamId}/members:
    post:
      tags: [Admin]
      summary: Admin thêm sinh viên vào nhóm (W16, W21)
      parameters: [ { $ref: '#/components/parameters/TeamId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [studentId], properties: { studentId: { type: string, format: uuid }, reason: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } } }
  /api/teams/{teamId}/members/{studentId}/remove:
    post:
      tags: [Admin]
      summary: "Admin bớt thành viên khỏi nhóm (W16) – áp dụng ngay, kể cả nhóm EXE201 kế thừa (không qua yêu cầu đổi nhóm); bớt trưởng nhóm thì người vào sớm nhất làm trưởng nhóm; bớt người cuối cùng thì nhóm bị giải tán. Phát MemberLeft (reason ADMIN)"
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/StudentId' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500, description: Ghi vào nhật ký nhóm } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /api/teams/{teamId}/members/{studentId}/move:
    post:
      tags: [Admin]
      summary: Admin chuyển sinh viên sang nhóm khác (W21)
      parameters: [ { $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/StudentId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [targetTeamId], properties: { targetTeamId: { type: string, format: uuid } } } } } }
      responses: { '204': { description: OK } }
  /api/teams/{teamId}/finalize:
    post: { tags: [Admin], summary: "Admin chốt một nhóm (W16, W22) – kiểm tra rule 1, 2", parameters: [ { $ref: '#/components/parameters/TeamId' } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } }, '409': { $ref: '#/components/responses/Problem' } } }
  /api/teams/{teamId}/reopen:
    post: { tags: [Admin], summary: Admin mở lại nhóm đã chốt, parameters: [ { $ref: '#/components/parameters/TeamId' } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamDetail' } } } } } }
  /api/teams/export:
    get:
      tags: [Admin]
      summary: Xuất Excel danh sách nhóm (W15, W22)
      parameters: [ { name: semesterId, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CourseCode' }, { name: status, in: query, schema: { $ref: '#/components/schemas/TeamStatus' } } ]
      responses: { '200': { description: File xlsx, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } } }
  /api/unmatched-students:
    get:
      tags: [Admin]
      summary: Sinh viên chưa có nhóm (W20)
      parameters: [ { $ref: '#/components/parameters/CourseCode' }, { name: specializationId, in: query, schema: { type: integer } }, { name: search, in: query, schema: { type: string }, description: Tên hoặc MSSV }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PagedMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/StudentRef' } } } } ] } } } } }
  /api/unmatched-students/remind:
    post: { tags: [Admin], summary: Gửi nhắc sinh viên chưa có nhóm (W20), requestBody: { content: { application/json: { schema: { type: object, properties: { courseCode: { type: string } } } } } }, responses: { '202': { description: Đã gửi } } }
  /api/auto-assignment/run:
    post:
      tags: [Admin]
      summary: Chạy lại ghép tự động (W20) – Team gọi Matching.PlanAutoAssignment rồi áp dụng
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [semesterId, courseCode], properties: { semesterId: { type: string, format: uuid }, courseCode: { type: string, enum: [EXE101, EXE201] } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AutoAssignResult' } } } } }
  /api/auto-assignment/result:
    get:
      tags: [Admin]
      summary: Kết quả ghép tự động gần nhất (W21)
      parameters: [ { name: semesterId, in: query, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CourseCode' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AutoAssignResult' } } } } }
  /api/statistics/overview:
    get:
      tags: [Admin]
      summary: Số liệu dashboard (W02)
      parameters: [ { name: semesterId, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CourseCode' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentsWithTeam: { type: integer }
                  studentsWithoutTeam: { type: integer }
                  teamsBySize: { type: object, additionalProperties: { type: integer }, example: { '4': 8, '5': 52, '6': 160 } }
                  pendingChangeRequests: { type: integer }
                  teamsNeedingReview: { type: integer }
                  bySpecialization: { type: array, items: { type: object, properties: { code: { type: string }, count: { type: integer } } } }
                  byDomain: { type: array, items: { type: object, properties: { code: { type: string }, count: { type: integer } } } }

  # ---------------- Internal (Job Service) ----------------
  /internal/advisor-matching/{kind}:
    post:
      tags: [Internal]
      summary: Job gọi lúc hết hạn lập nhóm (LECTURER) / tuần bắt đầu mentor (MENTOR) – ghép và áp dụng ngay (trigger SCHEDULED). Gọi lại không tạo trùng
      parameters: [ { $ref: '#/components/parameters/Kind' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [semesterId, courseCode], properties: { semesterId: { type: string, format: uuid }, courseCode: { type: string, enum: [EXE101, EXE201] } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdvisorMatchingRun' } } } } }
  /internal/teams/finalize-round:
    post:
      tags: [Internal]
      summary: Sau khi đợt đóng – chốt nhóm hợp lệ, nhóm còn lại NEEDS_REVIEW (rule 13)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [roundId, semesterId, courseCode], properties: { roundId: { type: string, format: uuid }, semesterId: { type: string, format: uuid }, courseCode: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { finalizedCount: { type: integer }, needsReviewCount: { type: integer } } } } } } }
  /internal/teams/auto-assign/apply:
    post:
      tags: [Internal]
      summary: Áp dụng phương án PlanAutoAssignment (rule 14)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { semesterId: { type: string, format: uuid }, courseCode: { type: string }, fills: { type: array, items: { type: object, properties: { teamId: { type: string, format: uuid }, studentIds: { type: array, items: { type: string, format: uuid } } } } }, newTeams: { type: array, items: { type: object, properties: { name: { type: string }, leaderStudentId: { type: string, format: uuid }, studentIds: { type: array, items: { type: string, format: uuid } } } } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AutoAssignResult' } } } } }
  /internal/invitations/expire-overdue:
    post:
      tags: [Internal]
      summary: InvitationExpiryJob – đánh dấu lời mời / yêu cầu quá hạn, phát InvitationExpired
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { invitations: { type: integer }, joinRequests: { type: integer } } } } } } }
  /internal/deadline-reminder-targets:
    get:
      tags: [Internal]
      summary: DeadlineReminderJob – sinh viên chưa có nhóm và nhóm dưới 4 người
      parameters: [ { name: semesterId, in: query, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CourseCode' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { studentIdsWithoutTeam: { type: array, items: { type: string, format: uuid } }, teamIdsUnderMinSize: { type: array, items: { type: string, format: uuid } } } } } } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    TeamId: { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    StudentId: { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
    CourseCode: { name: courseCode, in: query, schema: { type: string, enum: [EXE101, EXE201] } }
    AdvisorKind: { name: advisorKind, in: query, schema: { $ref: '#/components/schemas/AdvisorKind' } }
    Kind: { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/AdvisorKind' } }
    RequestStatus: { name: status, in: query, schema: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED, CANCELLED] } }
    Page: { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
  responses:
    Problem:
      description: Lỗi theo RFC 7807
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: array, items: { type: string } } } }
    PagedMeta:
      type: object
      properties: { page: { type: integer }, pageSize: { type: integer }, totalCount: { type: integer }, totalPages: { type: integer } }
    TeamStatus: { type: string, enum: [DRAFT, ACTIVE, NEEDS_REVIEW, FINALIZED, DISBANDED] }
    CatalogRef:
      type: object
      properties: { id: { type: integer }, code: { type: string }, name: { type: string } }
    StudentRef:
      type: object
      properties: { id: { type: string, format: uuid }, studentCode: { type: string }, fullName: { type: string }, specialization: { $ref: '#/components/schemas/CatalogRef' } }
    Member:
      allOf:
        - $ref: '#/components/schemas/StudentRef'
        - type: object
          properties:
            role: { type: string, enum: [LEADER, MEMBER] }
            phone: { type: string, nullable: true, description: "Từ file import; chỉ trả cho đồng đội, giảng viên hướng dẫn, mentor, Admin (rule 11)" }
            email: { type: string, nullable: true }
            joinedAt: { type: string, format: date-time }
            pendingChange: { type: string, enum: [LEAVING, NEW_MEMBER], nullable: true, description: Nhóm EXE201 kế thừa }
    TeamRequirement:
      type: object
      description: Dữ liệu cho TeamRequirementBar
      properties: { memberCount: { type: integer }, minSize: { type: integer }, maxSize: { type: integer }, specializationCount: { type: integer }, minSpecializations: { type: integer }, isValid: { type: boolean }, missingSpecializations: { type: array, items: { $ref: '#/components/schemas/CatalogRef' } } }
    TeamCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: string, format: uuid, nullable: true }
        projectName: { type: string, nullable: true }
        isProjectContinued: { type: boolean, description: "Đề tài tiếp tục từ EXE101 (\"Tiếp tục từ EXE101\")" }
        courseCode: { type: string, enum: [EXE101, EXE201] }
        status: { $ref: '#/components/schemas/TeamStatus' }
        domains: { type: array, items: { $ref: '#/components/schemas/CatalogRef' } }
        memberCount: { type: integer }
        openSlots: { type: integer }
        leader: { $ref: '#/components/schemas/StudentRef' }
        lecturerName: { type: string, nullable: true }
        mentorName: { type: string, nullable: true }
        requirement: { $ref: '#/components/schemas/TeamRequirement' }
    TeamDetail:
      allOf:
        - $ref: '#/components/schemas/TeamCard'
        - type: object
          properties:
            ideaDescription: { type: string, nullable: true, description: Mô tả đề tài hiện tại (projects.description) }
            project: { $ref: '#/components/schemas/ProjectSummary' }
            mentor: { allOf: [ { $ref: '#/components/schemas/MentorAssignment' } ], type: object, nullable: true }
            members: { type: array, items: { $ref: '#/components/schemas/Member' } }
            isInherited: { type: boolean }
            isAutoAssigned: { type: boolean }
            recruitmentPost: { allOf: [ { $ref: '#/components/schemas/RecruitmentPost' } ], type: object, nullable: true }
            hasPendingChanges: { type: boolean }
            myRelation: { type: string, enum: [LEADER, MEMBER, INVITED, REQUESTED, NONE], description: Quan hệ của người xem với nhóm (chọn nút ở S08) }
            finalizedAt: { type: string, format: date-time, nullable: true }
    TeamInput:
      type: object
      required: [name, domainIds]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        projectName: { type: string, maxLength: 200, description: Tên đề tài – tạo / sửa projects (rule 26) }
        ideaDescription: { type: string, maxLength: 4000 }
        domainIds: { type: array, minItems: 1, items: { type: integer } }
        primaryDomainId: { type: integer }
    MemberChangeResult:
      type: object
      properties:
        appliedImmediately: { type: boolean, description: "false = nhóm EXE201 kế thừa, đã thành thay đổi chờ duyệt" }
        team: { $ref: '#/components/schemas/TeamDetail' }
    Invitation:
      type: object
      properties: { id: { type: string, format: uuid }, team: { $ref: '#/components/schemas/TeamCard' }, invitee: { $ref: '#/components/schemas/StudentRef' }, message: { type: string, nullable: true }, status: { type: string }, createdAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time } }
    JoinRequest:
      type: object
      properties: { id: { type: string, format: uuid }, team: { $ref: '#/components/schemas/TeamCard' }, student: { $ref: '#/components/schemas/StudentRef' }, studentSkills: { type: array, items: { $ref: '#/components/schemas/SkillRating' }, description: "S20: SkillBars, client đánh dấu kỹ năng nhóm đang thiếu" }, studentDescription: { type: string, nullable: true }, message: { type: string, nullable: true }, ideas: { type: array, items: { $ref: '#/components/schemas/Idea' } }, hasNoIdea: { type: boolean }, status: { type: string }, createdAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time } }
    RecruitmentPostInput:
      type: object
      required: [title]
      properties: { title: { type: string, maxLength: 150 }, description: { type: string, maxLength: 2000 }, specializationIds: { type: array, items: { type: integer } } }
    RecruitmentPost:
      allOf:
        - $ref: '#/components/schemas/RecruitmentPostInput'
        - type: object
          properties: { id: { type: string, format: uuid }, status: { type: string, enum: [OPEN, CLOSED] }, updatedAt: { type: string, format: date-time } }
    SeekingPostInput:
      type: object
      required: [title]
      properties: { title: { type: string, maxLength: 150, description: Vai trò mong muốn }, description: { type: string, maxLength: 2000 }, domainIds: { type: array, items: { type: integer } } }
    SeekingPost:
      allOf:
        - $ref: '#/components/schemas/SeekingPostInput'
        - type: object
          properties: { id: { type: string, format: uuid }, student: { $ref: '#/components/schemas/StudentRef' }, skills: { type: array, items: { $ref: '#/components/schemas/SkillRating' } }, status: { type: string, enum: [OPEN, CLOSED] }, updatedAt: { type: string, format: date-time } }
    AuditLog:
      type: object
      properties: { id: { type: integer }, teamId: { type: string, format: uuid, nullable: true }, action: { type: string, example: MemberJoined }, actorName: { type: string }, actorRole: { type: string }, summary: { type: string }, reason: { type: string, nullable: true }, occurredAt: { type: string, format: date-time } }
    ChangeItem:
      type: object
      properties: { id: { type: string, format: uuid }, action: { type: string, enum: [ADD, REMOVE, SET_LEADER, PROJECT_CHANGE] }, source: { type: string }, student: { allOf: [ { $ref: '#/components/schemas/StudentRef' } ], type: object, nullable: true, description: null khi PROJECT_CHANGE }, newProjectName: { type: string, nullable: true }, newProjectDescription: { type: string, nullable: true }, createdAt: { type: string, format: date-time } }
    ChangeRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        team: { $ref: '#/components/schemas/TeamCard' }
        roundId: { type: string, format: uuid }
        roundName: { type: string }
        reason: { type: string }
        changedMemberCount: { type: integer }
        changedPercent: { type: number }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        reviewedByName: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ChangeRequestDetail:
      allOf:
        - $ref: '#/components/schemas/ChangeRequest'
        - type: object
          properties:
            baselineMembers: { type: array, items: { $ref: '#/components/schemas/Member' } }
            membersAfterChange: { type: array, items: { $ref: '#/components/schemas/Member' } }
            items: { type: array, items: { $ref: '#/components/schemas/ChangeItem' } }
            projectBefore: { $ref: '#/components/schemas/ProjectSummary' }
            projectAfter: { allOf: [ { $ref: '#/components/schemas/ProjectSummary' } ], type: object, nullable: true, description: Có khi yêu cầu chứa đổi đề tài }
    AdvisorKind: { type: string, enum: [LECTURER, MENTOR] }
    LecturerMatchReason: { type: string, enum: [MUTUAL, PREFERENCE, LECTURER_INTEREST, PREVIOUS_INSTRUCTOR, DOMAIN, MANUAL], description: "Nhãn: Hai bên cùng chọn · Nguyện vọng n · Giảng viên quan tâm · Đã hướng dẫn ở EXE101 · Theo chuyên môn · Bộ môn phân công" }
    MentorMatchReason: { type: string, enum: [MENTOR_INTEREST, DOMAIN, MANUAL] }
    LecturerRef:
      type: object
      properties: { lecturerId: { type: string, format: uuid }, fullName: { type: string }, domains: { type: array, items: { $ref: '#/components/schemas/CatalogRef' } } }
    LecturerPreferenceList:
      type: object
      properties:
        maxPreferences: { type: integer, example: 3 }
        locked: { type: boolean, description: true khi nhóm đã được ghép hoặc đợt đã đóng }
        lockAt: { type: string, format: date-time, nullable: true, description: Hạn chốt (hạn lập nhóm) }
        preferences: { type: array, items: { allOf: [ { $ref: '#/components/schemas/LecturerRef' } ], properties: { rank: { type: integer }, isInterested: { type: boolean } } } }
        interestedLecturers: { type: array, items: { $ref: '#/components/schemas/LecturerRef' }, description: Giảng viên đang quan tâm nhóm ("Quan tâm nhóm bạn") }
        previousInstructor: { allOf: [ { $ref: '#/components/schemas/LecturerRef' } ], type: object, nullable: true, description: "Giảng viên EXE101 cùng đề tài (\"Đã hướng dẫn ở EXE101\")" }
    LecturerAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        lecturerId: { type: string, format: uuid }
        lecturerName: { type: string }
        status: { type: string, enum: [ASSIGNED, REVOKED] }
        reason: { $ref: '#/components/schemas/LecturerMatchReason' }
        preferenceRank: { type: integer, nullable: true }
        source: { type: string, enum: [AUTO, MANUAL] }
        assignedAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
    AdvisedTeam:
      type: object
      properties:
        team: { $ref: '#/components/schemas/TeamCard' }
        reason: { type: string, description: LecturerMatchReason hoặc MentorMatchReason }
        preferenceRank: { type: integer, nullable: true }
        assignedAt: { type: string, format: date-time }
    AdvisorMatchingRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        advisorKind: { $ref: '#/components/schemas/AdvisorKind' }
        courseCode: { type: string, enum: [EXE101, EXE201] }
        trigger: { type: string, enum: [SCHEDULED, EARLY] }
        status: { type: string, enum: [PREVIEW, APPLIED, DISCARDED] }
        matchedCount: { type: integer }
        unmatchedCount: { type: integer }
        createdAt: { type: string, format: date-time }
        appliedAt: { type: string, format: date-time, nullable: true }
        plan:
          type: array
          items:
            type: object
            properties:
              teamId: { type: string, format: uuid }
              teamName: { type: string }
              advisorId: { type: string, format: uuid, nullable: true, description: null = không ghép được (mọi cố vấn đã đầy) }
              advisorName: { type: string, nullable: true }
              reason: { type: string, nullable: true }
              preferenceRank: { type: integer, nullable: true }
    AdvisorMatchingRow:
      type: object
      properties:
        team: { $ref: '#/components/schemas/TeamCard' }
        advisorId: { type: string, format: uuid, nullable: true }
        advisorName: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        preferenceRank: { type: integer, nullable: true }
        preferences: { type: array, items: { $ref: '#/components/schemas/LecturerRef' }, description: Chỉ với LECTURER }
        interests: { type: array, items: { $ref: '#/components/schemas/TopicInterest' } }
    AdvisorLoad:
      type: object
      properties:
        advisorId: { type: string, format: uuid }
        fullName: { type: string }
        assignedCount: { type: integer }
        preferredTeams: { type: integer, nullable: true, description: Chỉ mentor }
        maxTeams: { type: integer, nullable: true, description: null = không giới hạn (giảng viên) }
    AutoAssignResult:
      type: object
      properties:
        runAt: { type: string, format: date-time }
        filledTeams: { type: array, items: { $ref: '#/components/schemas/TeamCard' } }
        newTeams: { type: array, items: { $ref: '#/components/schemas/TeamCard' } }
        unassignedStudents: { type: array, items: { $ref: '#/components/schemas/StudentRef' } }
    SkillRating:
      type: object
      properties:
        skill: { type: string, enum: [TECHNOLOGY, UI_UX_DESIGN, MANAGEMENT, MARKETING, COMMUNICATION_PLANNING] }
        level: { type: integer, minimum: 1, maximum: 5 }
    Idea:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 300, nullable: true }
    ProjectSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        currentVersion: { type: integer }
        originCourseCode: { type: string, enum: [EXE101, EXE201] }
        originSemesterCode: { type: string, example: SP26 }
    ProjectVersion:
      type: object
      properties:
        version: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        changeType: { type: string, enum: [CREATED, EDITED, PIVOT] }
        reason: { type: string, nullable: true }
        semesterCode: { type: string }
        courseCode: { type: string, enum: [EXE101, EXE201] }
        changedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/ProjectVersion' }, description: Mới nhất trước – ProjectTimeline }
            teams:
              type: array
              description: Các nhóm đi qua đề tài, theo thứ tự kỳ (EXE101 → EXE201)
              items:
                type: object
                properties:
                  team: { $ref: '#/components/schemas/TeamCard' }
                  semesterCode: { type: string }
                  keptMemberPercent: { type: number, nullable: true, description: "% thành viên giữ lại so với nhóm kỳ trước (W29)" }
                  instructorName: { type: string, nullable: true }
                  mentorName: { type: string, nullable: true }
    TopicRecommendation:
      type: object
      properties:
        team: { $ref: '#/components/schemas/TeamCard' }
        matchedDomains: { type: array, items: { $ref: '#/components/schemas/CatalogRef' } }
        otherInterestedCount: { type: integer, description: "Chỉ số lượng, không trả tên người khác (rule 19)" }
        myPreferenceRank: { type: integer, nullable: true, description: Nhóm xếp tôi ở nguyện vọng mấy (chỉ giảng viên) }
        myInterest: { allOf: [ { $ref: '#/components/schemas/TopicInterest' } ], type: object, nullable: true }
        wasMyEXE101Team: { type: boolean, description: Đề tài mình hướng dẫn ở EXE101 – đứng đầu danh sách (rule 26) }
        hasAdvisor: { type: boolean, description: "true → thẻ \"Đã có giảng viên\" / \"Đã có mentor\", ẩn nút" }
    TopicInterest:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        advisorKind: { $ref: '#/components/schemas/AdvisorKind' }
        advisorId: { type: string, format: uuid }
        advisorName: { type: string, description: "Chỉ trả cho Admin, cho chính người đó, và cho thành viên nhóm khi là giảng viên" }
        wasPreviousInstructor: { type: boolean, description: Giảng viên hướng dẫn đề tài này ở EXE101 }
        status: { type: string, enum: [OPEN, WITHDRAWN, CLOSED] }
        closedReason: { type: string, nullable: true, enum: [THIS_ADVISOR_MATCHED, OTHER_ADVISOR_MATCHED, TEAM_DISBANDED] }
        createdAt: { type: string, format: date-time }
    MentorAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        mentorName: { type: string }
        mentorOrganization: { type: string, nullable: true }
        isInternal: { type: boolean }
        status: { type: string, enum: [ASSIGNED, ENDED] }
        reason: { $ref: '#/components/schemas/MentorMatchReason' }
        source: { type: string, enum: [AUTO, MANUAL] }
        assignedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
