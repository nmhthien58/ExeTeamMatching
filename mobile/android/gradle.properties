org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Bật Kotlin có sẵn của AGP 9: plugin như file_picker 11 bỏ KGP khi AGP ≥ 9, tắt cờ này thì code Kotlin của plugin không được biên dịch (MB-36)
android.builtInKotlin=true
# Tắt biên dịch Kotlin tăng dần: mã plugin nằm ở pub cache (ổ C:) còn thư mục build ở ổ khác (D:) thì Kotlin
# báo "Could not close incremental caches" khi build plugin Firebase (MB-47)
kotlin.incremental=false
