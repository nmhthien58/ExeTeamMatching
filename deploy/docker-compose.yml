# BE-08 – Toàn hệ thống: hạ tầng + 8 service .NET + web (cổng theo PROJECT_CONTEXT §9).
# Chạy: cd deploy && cp .env.example .env && docker compose up -d --build
# Service .NET dùng chung deploy/docker/dotnet.Dockerfile (build context = backend/).
name: exe-team-matching

x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
  interval: 10s
  timeout: 5s
  start_period: 20s
  retries: 12

x-jwt-env: &jwt-env
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}

services:
  postgres:
    image: postgres:16-alpine
    container_name: exe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev_pw}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:-academic_dev_pw}
      TEAM_DB_PASSWORD: ${TEAM_DB_PASSWORD:-team_dev_pw}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev_pw}
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD:-job_dev_pw}
      COLLAB_DB_PASSWORD: ${COLLAB_DB_PASSWORD:-collab_dev_pw}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_NAME: ${ADMIN_NAME:-Bộ môn EXE}
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro    # DB script (BE-01), chỉ chạy khi volume trống
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d team_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: exe-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: exe-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: exe-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: exe-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: exe-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # giao diện xem email
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Lưu file dự án của workspace (rule 24, BE-63). Máy chủ tương thích S3: SeaweedFS
  # (MinIO đã gỡ image khỏi Docker Hub). Collab dùng API S3 chuẩn nên đổi máy chủ không phải sửa code.
  # S3 API: http://localhost:9000 · giao diện filer: http://localhost:9001
  object-storage:
    image: chrislusf/seaweedfs:3.97
    container_name: exe-object-storage
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -filer.port=8888
    ports:
      - "9000:8333"   # S3 API
      - "9001:8888"   # filer UI
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro   # khóa truy cập dev (giá trị giả)
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- Service .NET (container nghe 8080, Development để có Swagger và /api/dev/token) ----------
  # Chỉ ghi đè cấu hình mà service đã đọc. Service thêm DB/Kafka/... thì thêm biến tương ứng ở đây (PR cho Thiên).

  identity-api:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: Services/Identity/Identity.Api/Identity.Api.csproj
        APP_DLL: Identity.Api.dll
    container_name: exe-identity-api
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=identity_db;Username=identity_svc;Password=${IDENTITY_DB_PASSWORD:-identity_dev_pw}
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "5001:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      postgres:
        condition: service_healthy

  academic-api:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: Services/Academic/Academic.Api/Academic.Api.csproj
        APP_DLL: Academic.Api.dll
    container_name: exe-academic-api
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AcademicDb: Host=postgres;Port=5432;Database=academic_db;Username=academic_svc;Password=${ACADEMIC_DB_PASSWORD:-academic_dev_pw}
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:29092
      Team__BaseUrl: http://team-api:8080   # số nhóm đang mentor (BE-66, POST /internal/mentors/team-counts)
    ports:
      - "5002:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      postgres:
        condition: service_healthy

  team-api:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: Services/Team/Team.Api/Team.Api.csproj
        APP_DLL: Team.Api.dll
    container_name: exe-team-api
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TeamDb: Host=postgres;Port=5432;Database=team_db;Username=team_svc;Password=${TEAM_DB_PASSWORD:-team_dev_pw}
      Kafka__BootstrapServers: kafka:29092
      Academic__BaseUrl: http://academic-api:8080
      Matching__BaseUrl: http://matching-grpc:8080   # gRPC: chốt nhóm, ghép tự động, gợi ý (BE-48, BE-49, BE-39)
    ports:
      - "5003:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      matching-grpc:
        condition: service_healthy

  # Chỉ HTTP/2 (gRPC, không TLS): healthcheck dùng --http2-prior-knowledge. Không có route qua Gateway.
  matching-grpc:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: Services/Matching/Matching.Grpc/Matching.Grpc.csproj
        APP_DLL: Matching.Grpc.dll
    container_name: exe-matching-grpc
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__EndpointDefaults__Protocols: Http2
      Kafka__BootstrapServers: kafka:29092
      ConnectionStrings__Redis: redis:6379   # read model (BE-35)
    ports:
      - "5004:8080"
    healthcheck:
      <<: *dotnet-healthcheck
      test: ["CMD-SHELL", "curl -fsS --http2-prior-knowledge http://localhost:8080/health || exit 1"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: Services/Notification/Notification.Worker/Notification.Worker.csproj
        APP_DLL: Notification.Worker.dll
    container_name: exe-notification
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=notification_db;Username=notification_svc;Password=${NOTIFICATION_DB_PASSWORD:-notification_dev_pw}
      Kafka__BootstrapServers: kafka:29092
      Smtp__Host: mailpit
      Smtp__Port: 1025
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "5005:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      mailpit:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  jobs:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: Services/Jobs/Jobs.Host/Jobs.Host.csproj
        APP_DLL: Jobs.Host.dll
    container_name: exe-jobs
    environment:
      <<: *jwt-env   # ký token dịch vụ cho /internal/* (BE-51)
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__JobDb: Host=postgres;Port=5432;Database=job_db;Username=job_svc;Password=${JOB_DB_PASSWORD:-job_dev_pw}
      Kafka__BootstrapServers: kafka:29092
      Jobs__AcademicUrl: http://academic-api:8080
      Jobs__TeamUrl: http://team-api:8080
      Jobs__MatchingUrl: http://matching-grpc:8080
      Jobs__CollabUrl: http://collab-api:8080
    ports:
      - "5006:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  collab-api:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: Services/Collaboration/Collab.Api/Collab.Api.csproj
        APP_DLL: Collab.Api.dll
    container_name: exe-collab-api
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CollabDb: Host=postgres;Port=5432;Database=collab_db;Username=collab_svc;Password=${COLLAB_DB_PASSWORD:-collab_dev_pw}
      Academic__BaseUrl: http://academic-api:8080
      Kafka__BootstrapServers: kafka:29092
      ObjectStorage__ServiceUrl: http://object-storage:8333
      ObjectStorage__PublicUrl: http://localhost:9000   # URL tải file ký sẵn trả cho trình duyệt / app
    ports:
      - "5007:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  gateway:
    build:
      context: ../backend
      dockerfile: ../deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: ApiGateway/ApiGateway.csproj
        APP_DLL: ApiGateway.dll
    container_name: exe-gateway
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:29092
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity-api:8080/
      ReverseProxy__Clusters__academic__Destinations__d1__Address: http://academic-api:8080/
      ReverseProxy__Clusters__team__Destinations__d1__Address: http://team-api:8080/
      ReverseProxy__Clusters__notification__Destinations__d1__Address: http://notification:8080/
      ReverseProxy__Clusters__collab__Destinations__d1__Address: http://collab-api:8080/
    ports:
      - "8080:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      identity-api:
        condition: service_healthy
      academic-api:
        condition: service_healthy
      team-api:
        condition: service_healthy
      notification:
        condition: service_healthy
      collab-api:
        condition: service_healthy

  # FE-01 – React build tĩnh phục vụ bằng nginx. Biến VITE_* được gắn lúc build.
  # BE-57: seed dữ liệu demo ẩn danh qua API, chạy một lần: docker compose --profile seed run --rm seed
  seed:
    image: node:22-alpine
    profiles: [seed]
    working_dir: /seed
    volumes:
      - ./seed:/seed:ro
    command: ["node", "seed-demo.mjs"]
    environment:
      SEED_GATEWAY_URL: http://gateway:8080
      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      SEED_HEALTH_URLS: http://gateway:8080/health,http://identity-api:8080/health,http://academic-api:8080/health,http://team-api:8080/health,http://notification:8080/health,http://jobs:8080/health,http://collab-api:8080/health
    depends_on:
      gateway:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-221888974127-ho8c6t3rqct6f7r5o2e8gott7i8lrd7s.apps.googleusercontent.com}
    container_name: exe-web
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  object-data:
