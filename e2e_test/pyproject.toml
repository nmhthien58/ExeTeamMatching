[project]
name = "exe-team-matching-e2e"
version = "0.1.0"
description = "Kiểm thử E2E mobile bằng Google ARTEMIS (MB-58)"
requires-python = ">=3.12"
dependencies = [
    # Pin commit đã dùng, ghi trong README.md.
    "artemis-client @ git+https://github.com/google/artemis.git@351ca8422f7b5b54e80a9c1ce03a222e02415b6b#subdirectory=packages/artemis-client",
    "pytest>=8.3",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = [
    "pending(reason): ca chờ task khác hoặc chờ dữ liệu, bị bỏ qua khi chưa bật",
]
