<style>
  body { font: 12px/1.5 Inter, system-ui, sans-serif; margin: 12px; color: var(--figma-color-text); background: var(--figma-color-bg); }
  #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f24822; margin-right: 6px; }
  #dot.on { background: #14ae5c; }
  #last { color: var(--figma-color-text-secondary); margin-top: 8px; word-break: break-word; }
</style>
<div><span id="dot"></span><b id="status">Đang kết nối…</b></div>
<div id="last">Giữ cửa sổ này mở để Claude có thể thao tác trên file.</div>
<script>
  var BASE = 'http://localhost:3055';
  var dot = document.getElementById('dot');
  var statusEl = document.getElementById('status');
  var lastEl = document.getElementById('last');
  var done = 0;

  function setStatus(on) {
    dot.className = on ? 'on' : '';
    statusEl.textContent = on ? 'Đã kết nối với bridge' : 'Chưa thấy server (node server.js)';
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function loop() {
    while (true) {
      try {
        var res = await fetch(BASE + '/poll');
        setStatus(true);
        if (res.status === 200) {
          var job = await res.json();
          lastEl.textContent = 'Đang chạy lệnh #' + job.id + '…';
          parent.postMessage({ pluginMessage: { type: 'run', id: job.id, code: job.code } }, '*');
        }
      } catch (e) {
        setStatus(false);
        await sleep(1500);
      }
    }
  }

  window.onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg || msg.type !== 'result') return;
    done++;
    lastEl.textContent = (msg.ok ? 'Xong' : 'Lỗi') + ' lệnh #' + msg.id + ' · tổng ' + done + ' lệnh';
    // String body => text/plain => no CORS preflight needed.
    fetch(BASE + '/result', { method: 'POST', body: JSON.stringify(msg) }).catch(function () {});
  };

  loop();
</script>
